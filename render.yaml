services:
  # Backend — Laravel API (requires Starter plan for Docker)
  - type: web
    name: eevents-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/public/color-themes
    envVars:
      - key: APP_NAME
        value: E Events
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: eevents-backend
          property: hostWithScheme
      - key: APP_FRONTEND_URL
        fromService:
          type: web
          name: eevents-frontend
          property: hostWithScheme
      - key: DATABASE_URL
        fromDatabase:
          name: eevents-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: eevents-redis
          property: connectionString
      - key: QUEUE_CONNECTION
        value: redis
      - key: CACHE_DRIVER
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: FILESYSTEM_PUBLIC_DISK
        value: local
      - key: FILESYSTEM_PRIVATE_DISK
        value: local
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGO
        value: HS256
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: noreply@example.com
      - key: MAIL_FROM_NAME
        value: E Events
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # Frontend — React CSR Static Site (FREE on Render)
  - type: web
    name: eevents-frontend
    runtime: static
    buildCommand: yarn install && yarn messages:compile && yarn build:csr
    staticPublishPath: ./dist
    rootDir: frontend
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL_CLIENT
        value: https://eevents-backend.onrender.com/api
      - key: VITE_API_URL_SERVER
        value: https://eevents-backend.onrender.com/api
      - key: VITE_FRONTEND_URL
        value: https://eevents-frontend.onrender.com
      - key: VITE_PAYSTACK_PUBLIC_KEY
        sync: false
      - key: VITE_APP_NAME
        value: E Events
      - key: VITE_APP_PRIMARY_COLOR
        value: "#16A249"
      - key: VITE_APP_SECONDARY_COLOR
        value: "#0D6B47"

databases:
  - name: eevents-postgres
    plan: free
    databaseName: eevents
    user: eevents

  - name: eevents-redis
    plan: free
