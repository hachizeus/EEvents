<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="50" viewBox="0 0 180 50">
  <title>E Events Text Logo - Dark</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;display=swap');
    .logo-text { font-family: 'Outfit', sans-serif; font-weight: 800; letter-spacing: -0.02em; }
  </style>

  <!-- White text for dark backgrounds, green dot -->
  <text x="90" y="25" class="logo-text" font-size="32" fill="#ffffff" text-anchor="middle" dominant-baseline="central">E<tspan fill="#16A249">.</tspan>EVENTS</text>
</svg>
